name: Pricing Watch

on:
  schedule:
    - cron: '6 22 * * *' # 北京时间 06:06 (UTC+8)
  push:
    branches: [main]
    paths:
      - 'assets/pricing-feed.json'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only (audit without modifying files or opening PRs)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && 'purge-cdn' || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  TZ: UTC

permissions: {}

jobs:
  purge-cdn:
    name: Purge jsDelivr Pricing Feed Cache
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Purge jsDelivr CDN Cache
        shell: bash
        run: |
          PURGE_URL="https://purge.jsdelivr.net/gh/${{ github.repository }}@main/assets/pricing-feed.json"
          PURGED=false
          for attempt in 1 2; do
            if PURGE_RESP=$(curl -fsS --max-time 15 "$PURGE_URL" 2>&1); then
              echo "jsDelivr purge succeeded (attempt $attempt): $PURGE_RESP"
              PURGED=true
              break
            fi
            [ "$attempt" -lt 2 ] && sleep 3
          done
          if [ "$PURGED" != "true" ]; then
            echo "::warning::jsDelivr CDN purge failed after 2 attempts for $PURGE_URL: $PURGE_RESP"
          fi

  pricing-audit:
    name: Auto Pricing Audit & Consensus Sync
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.PRICING_AUTO_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Run Official Scrape, Gemini Extraction & Consensus Check
        id: audit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node tools/auto-update-pricing.mjs --dry-run
          else
            node tools/auto-update-pricing.mjs --write
          fi

      - name: Verify Build, Feed Parity & Pricing Regression Tests
        id: gate
        shell: bash
        run: |
          set +e
          (
            set -e
            npm run build --ignore-scripts
            node tools/sync-pricing-feed.mjs
            node --test test/pricing-*.test.mjs
          ) > pricing-gate.log 2>&1
          STATUS=$?
          cat pricing-gate.log
          if [ "$STATUS" -eq 0 ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Pricing verification gate failed; blocking auto-merge and downgrading to manual review."
          fi

      - name: Fail Job if Baseline Main Branch Gate Failed Without Modifications
        if: steps.gate.outputs.passed != 'true' && steps.audit.outputs.files_modified != 'true'
        run: exit 1

      - name: Create PR & Auto-Merge (Green) or Hold for Review (Yellow)
        if: inputs.dry_run != true && steps.audit.outputs.files_modified == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.PRICING_AUTO_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
          DECISION: ${{ steps.audit.outputs.decision }}
          GATE_PASSED: ${{ steps.gate.outputs.passed }}
          STAGED_NEW_COUNT: ${{ steps.audit.outputs.staged_new_count || '0' }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="chore/auto-pricing-sync"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BASE_SHA=$(git rev-parse HEAD)
          EXISTING_PR_JSON=$(gh pr list --head "$BRANCH" --state open --json url,title,body --jq '.[0] // empty')
          EXISTING_PR=$(node --input-type=module -e 'const s = process.argv[1]; console.log(s ? JSON.parse(s).url : "");' "$EXISTING_PR_JSON")
          HAS_REMOTE_BRANCH=false
          if git fetch origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" 2>/dev/null; then
            HAS_REMOTE_BRANCH=true
          fi

          if [ "$HAS_REMOTE_BRANCH" = "true" ] && [ -n "$EXISTING_PR" ]; then
            HUMAN_AUTHORS=$(git log "${BASE_SHA}..origin/${BRANCH}" --format='%an' | grep -vx 'github-actions\[bot\]' || true)
            if [ -n "$HUMAN_AUTHORS" ]; then
              echo "::warning::Open PR $EXISTING_PR on $BRANCH contains manual commits ($HUMAN_AUTHORS); skipping force-push to preserve manual work."
              echo "merged=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          EFFECTIVE_DECISION="$DECISION"
          if [ "$GATE_PASSED" != "true" ]; then
            EFFECTIVE_DECISION="yellow_needs_review"
          fi

          if [ "$EFFECTIVE_DECISION" = "green_auto_merge" ]; then
            COMMIT_MSG="chore(pricing): auto-sync verified model prices"
            PR_TITLE="chore(pricing): auto-sync verified model prices"
          elif [ "${STAGED_NEW_COUNT:-0}" -gt 0 ]; then
            COMMIT_MSG="chore(pricing): stage verified new model candidates for review"
            PR_TITLE="[Needs-Review] Auto-staged new model pricing candidates"
          else
            COMMIT_MSG="chore(pricing): pricing update needs manual review"
            PR_TITLE="[Needs-Review] Pricing update or divergence detected"
          fi

          BODY_FILE="pricing-pr-body.md"
          node --input-type=module -e '
            import { readFile, writeFile } from "node:fs/promises";
            const report = JSON.parse(await readFile("pricing-watch-alert.json", "utf8"));
            const gatePassed = process.env.GATE_PASSED === "true";
            const extra = gatePassed ? "" : "\n\n> ⚠️ **Pricing Gate Failed**: One or more pricing tests failed after updating `assets/model-catalog.json`. Auto-merge has been blocked for manual review.\n";
            await writeFile("pricing-pr-body.md", report.summaryMarkdown + extra, "utf8");
          '

          NEED_PUSH=true
          if [ "$HAS_REMOTE_BRANCH" = "true" ] && [ -n "$EXISTING_PR" ] && git merge-base --is-ancestor "$BASE_SHA" "origin/$BRANCH"; then
            SEMANTIC_CHANGED=$(node --input-type=module -e '
              import { execFileSync } from "node:child_process";
              import { readFileSync } from "node:fs";
              import { hasSemanticCatalogChanges } from "./tools/auto-update-pricing.mjs";
              try {
                const prev = JSON.parse(execFileSync("git", ["show", `origin/${process.argv[1]}:assets/model-catalog.json`], { encoding: "utf8" }));
                const next = JSON.parse(readFileSync("assets/model-catalog.json", "utf8"));
                console.log(hasSemanticCatalogChanges(prev, next) ? "true" : "false");
              } catch {
                console.log("true");
              }
            ' "$BRANCH")
            if [ "$SEMANTIC_CHANGED" = "false" ]; then
              NEED_PUSH=false
              echo "Remote branch $BRANCH already contains semantically identical pricing catalog changes; skipping redundant commit and force-push."
            fi
          fi

          if [ "$NEED_PUSH" = "true" ]; then
            git checkout -B "$BRANCH"
            git add assets/model-catalog.json assets/pricing-feed.json
            if git diff --cached --quiet; then
              echo "No git diff after staging; skipping PR."
              echo "merged=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "$COMMIT_MSG"
            git push --force-with-lease origin "$BRANCH"
          fi

          if [ -n "$EXISTING_PR" ]; then
            PR_URL="$EXISTING_PR"
            PR_METADATA_CHANGED=$(node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const existing = process.argv[1] ? JSON.parse(process.argv[1]) : {};
              const nextTitle = process.argv[2];
              const nextBody = readFileSync(process.argv[3], "utf8").trimEnd();
              const prevBody = String(existing.body ?? "").trimEnd();
              console.log(existing.title !== nextTitle || prevBody !== nextBody ? "true" : "false");
            ' "$EXISTING_PR_JSON" "$PR_TITLE" "$BODY_FILE")
            if [ "$PR_METADATA_CHANGED" = "true" ]; then
              gh pr edit "$PR_URL" --title "$PR_TITLE" --body-file "$BODY_FILE"
            else
              echo "Existing PR title and body are unchanged; skipping gh pr edit."
            fi
          else
            PR_URL=$(gh pr create --base "${{ github.event.repository.default_branch || github.ref_name }}" --head "$BRANCH" --title "$PR_TITLE" --body-file "$BODY_FILE")
          fi
          echo "PR URL: $PR_URL"

          if [ "$EFFECTIVE_DECISION" = "green_auto_merge" ]; then
            if gh pr merge "$PR_URL" --squash --delete-branch; then
              echo "Auto-merged immediately into ${{ github.ref_name }}."
              echo "merged=true" >> "$GITHUB_OUTPUT"
              PURGE_URL="https://purge.jsdelivr.net/gh/${{ github.repository }}@main/assets/pricing-feed.json"
              PURGED=false
              for attempt in 1 2; do
                if PURGE_RESP=$(curl -fsS --max-time 15 "$PURGE_URL" 2>&1); then
                  echo "jsDelivr purge succeeded (attempt $attempt): $PURGE_RESP"
                  PURGED=true
                  break
                fi
                [ "$attempt" -lt 2 ] && sleep 3
              done
              if [ "$PURGED" != "true" ]; then
                echo "::warning::jsDelivr CDN purge failed after 2 attempts for $PURGE_URL: $PURGE_RESP"
              fi
            elif gh pr merge "$PR_URL" --auto --squash --delete-branch; then
              echo "Enabled auto-merge pending required status checks."
              echo "merged=auto_queued" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::Created green PR $PR_URL, but GitHub repository settings prevented automatic merge."
              gh pr comment "$PR_URL" --body "已通过双源共识与本地定价门禁，但仓库分支保护或自动合并权限阻止了自动合入。如需全自动合入，请启用仓库 Allow auto-merge，或在分支保护需要 CI Gate 时配置 \`PRICING_AUTO_MERGE_TOKEN\`。"
              echo "merged=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "merged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Auto-Close Obsolete Pricing PR When Main Is Already Synced
        if: inputs.dry_run != true && steps.audit.outputs.files_modified != 'true' && steps.audit.outputs.decision == 'no_change'
        env:
          GH_TOKEN: ${{ secrets.PRICING_AUTO_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="chore/auto-pricing-sync"
          PR_NUMBER=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // ""')
          if [ -z "$PR_NUMBER" ]; then
            exit 0
          fi
          BASE_SHA=$(git rev-parse HEAD)
          if git fetch origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" 2>/dev/null; then
            HUMAN_AUTHORS=$(git log "${BASE_SHA}..origin/${BRANCH}" --format='%an' | grep -vx 'github-actions\[bot\]' || true)
            if [ -n "$HUMAN_AUTHORS" ]; then
              echo "::warning::Open PR #$PR_NUMBER on $BRANCH contains manual commits ($HUMAN_AUTHORS); skipping auto-close."
              exit 0
            fi
          fi
          gh pr close "$PR_NUMBER" --delete-branch --comment "当前 \`main\` 分支价格资产已与上游官网及 Antigravity 宿主清单保持一致，本自动 PR 已过时，自动关闭并清理远端分支。"

      - name: Open, Update, or Auto-Close Pricing Drift Alert Issue
        if: inputs.dry_run != true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          DECISION: ${{ steps.audit.outputs.decision }}
          GATE_PASSED: ${{ steps.gate.outputs.passed }}
          MERGED: ${{ steps.pr.outputs.merged || 'false' }}
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('pricing-watch-alert.json', 'utf8'));
            const title = '[Pricing Watch] Upstream model rate drift or promotional expiry detected';
            const hasPendingReviewItems =
              (Array.isArray(report.yellowItems) && report.yellowItems.length > 0) ||
              (Array.isArray(report.expiring) && report.expiring.length > 0) ||
              (Array.isArray(report.newModelsRadar) && report.newModelsRadar.length > 0);
            const hasPageAlerts = Array.isArray(report.pageAlerts) && report.pageAlerts.length > 0;
            const needsIssue =
              process.env.DECISION === 'yellow_needs_review' ||
              process.env.DECISION === 'fetch_failed' ||
              hasPendingReviewItems ||
              hasPageAlerts ||
              process.env.GATE_PASSED !== 'true';

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const match = existing.data.find(issue => !issue.pull_request && issue.title === title);

            if (needsIssue) {
              const headerLine = process.env.DECISION === 'fetch_failed'
                ? 'Automated daily pricing watch failed to fetch or parse one or more upstream pricing pages or Antigravity model docs. Please inspect the alerts below.'
                : 'Automated daily pricing watch detected rate divergence, unverified new models, or upcoming promotional expiry.';
              const bodyParts = [headerLine];
              if (process.env.GATE_PASSED !== 'true') {
                bodyParts.push(
                  '',
                  '> ⚠️ **Pricing Gate Failed**: One or more pricing tests failed after updating `assets/model-catalog.json`. Auto-merge has been blocked for manual review.'
                );
              }
              bodyParts.push(
                '',
                report.summaryMarkdown,
                '',
                'Please review and run `node tools/sync-pricing-feed.mjs --write` if manually adjusting `assets/model-catalog.json`.'
              );
              const body = bodyParts.join('\n');

              if (match) {
                if (match.body !== body) {
                  await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: match.number,
                    body,
                  });
                }
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                });
              }
            } else if (match && process.env.DECISION !== 'fetch_failed') {
              const closeReason = process.env.MERGED === 'true'
                ? '双源共识核验通过并已自动合入 `main`，上游价格分歧已消除，自动关闭本 Issue。'
                : '当前所有受监控模型价格已与官网及 LiteLLM 保持一致，自动关闭本 Issue。';
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body: closeReason,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                state: 'closed',
              });
            }
